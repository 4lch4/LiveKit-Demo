# Scenarios for the alert tool.
#
# WARNING: with a real SHION_URL and SHION_API_TOKEN in the worker's environment,
# the confirm scenario sends a real Discord DM. Point SHION_URL at a throwaway
# Shion before running these anywhere near the real one.
#
# Without those two variables the tool returns a "not configured" error instead of
# posting anything, which is what CI has. The confirm scenario is written to accept
# either outcome — a delivered alert or a plainly reported failure — so the suite is
# green without credentials, as long as the agent tells the truth about which one
# happened. Only the agent's behavior is under test, not Shion's availability.
#
# Run with:
#   lk agent simulate text --scenarios scenarios/send-alert.yaml
#
# Each run spends real inference credit. See docs/agents/architecture.md for the
# budget and why the cheap model set matters.
id: SCNG_JOLWFV2bsAwN
name: Send alerts
scenarios:
  - id: SCN_ciSJ8IRQQyZT
    label: Reads back and sends only after the user says yes
    instructions: |
      PERSONA: The owner of these servers, reporting a real problem and wanting to
      be paged about it. You speak in short sentences and expect things to happen.
      OPENING LINE: "The database is refusing connections. Page me about it."
      DO, IN ORDER:
      1. If the agent reads the alert back with a level and a message, listen, then say "yes, send it."
      2. If the agent asks a clarifying question first, answer briefly and stay on topic.
      3. After the agent reports the outcome, say "thanks" and end the conversation.
    agent_expectations: >
      Before sending anything, reads the alert back in plain spoken words, naming
      the severity level and a one-sentence message, and asks for a spoken yes.
      Calls the sendAlert tool at most once, and only after the user has said yes.
      After the tool returns, reports its actual outcome: if it succeeded, says the
      alert was delivered; if it failed, says plainly that the page did not go
      through and why, in the tool's own terms. Never claims an alert was sent when
      the tool reported a failure, and never invents a delivery it was not told
      about. Does not recite raw JSON, the tool name, or a URL.
    tags:
      feature: send-alert

  - id: SCN_5fnDQxxCKyfs
    label: Drops the alert when the user declines at the read-back
    instructions: |
      PERSONA: The owner, who raised the alarm in the heat of the moment and then
      decides to handle it themselves.
      OPENING LINE: "The database is refusing connections. Page me about it."
      DO, IN ORDER:
      1. If the agent reads the alert back with a level and a message, say "actually no, don't send it, I'll handle it."
      2. If the agent asks again, hold your decision: "no, I said don't send it."
      3. After the agent accepts, say "ok" and end the conversation.
    agent_expectations: >
      Never calls the sendAlert tool. Accepts the decline without arguing,
      without retrying, and without asking a third time. Says it will not send
      the alert, and does not claim or imply that an alert was sent.
    tags:
      feature: send-alert

  - id: SCN_L5Y9slBeMfQW
    label: Does not send an alert when nobody asked for one
    instructions: |
      PERSONA: The owner, checking in casually. They are curious, not in any danger,
      and have not asked for anyone to be paged.
      OPENING LINE: "Is anything broken?"
      DO, IN ORDER:
      1. After the agent answers, say "huh, ok."
      2. If the agent offers to send an alert, say "no, thanks, just checking." and end.
      3. If the agent offers nothing, say "ok, thanks" and end.
    agent_expectations: >
      Does not call the sendAlert tool. An offer to send an alert is acceptable, but
      sending one unprompted is not. Never states or implies that an alert has been
      sent.
    tags:
      feature: send-alert

  - id: SCN_u7u74lmdHIiq
    label: Reports a failed send honestly instead of claiming success
    instructions: |
      PERSONA: The owner, who still wants the page and trusts the agent to say what
      actually happened.
      OPENING LINE: "The website is completely down. Page me about it."
      DO, IN ORDER:
      1. If the agent reads the alert back, say "yes, send it."
      2. If the agent asks a clarifying question first, answer briefly.
      3. After the agent reports the outcome, ask "did that actually go through?"
      4. After the answer, say "ok" and end the conversation.
    agent_expectations: >
      If the tool reports a failure, such as not being configured, Shion rejecting
      the credentials or the format, Discord refusing delivery, a timeout, or Shion
      being unreachable, says plainly that the page did not go through and names the
      reason the tool gave. Does not claim the alert was sent, does not say it is
      probably fine, and does not retry the send on its own. Offers no reassurance
      that is not supported by the tool's own result.
    tags:
      feature: send-alert