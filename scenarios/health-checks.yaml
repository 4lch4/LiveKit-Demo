# Scenarios for the health-check tool.
#
# These drive `checkServers` to a deterministic end state, so they depend on the
# tool actually running. That means `HEALTH_TARGETS` must be set for the worker
# and the targets must be reachable from wherever the simulation runs.
#
# Run with:
#   lk agent simulate text --scenarios scenarios/health-checks.yaml
#
# Each run spends real inference credit. See docs/agents/architecture.md for the
# budget and why the cheap model set matters.
name: Health checks
scenarios:
  - label: Reports status when asked if anything is broken
    instructions: |
      PERSONA: The owner of these servers, checking in casually after deploying
      something. You speak in short sentences and want a straight answer.
      OPENING LINE: "Is anything broken?"
      DO, IN ORDER:
      1. Listen to the answer.
      2. If the agent asks a follow-up question, answer it briefly.
      3. Once you have a clear status, say "thanks" and end the conversation.
    agent_expectations: >
      Calls the checkServers tool and then reports the result in plain spoken
      prose. States how many servers are healthy out of how many are being
      checked, using the actual numbers from the tool rather than invented ones.
      If any server is unhealthy, names which one and what went wrong. Does not
      recite raw JSON, URLs, or tool names. Three sentences or fewer.
    tags:
      feature: health-check

  - label: Checks again on a follow-up rather than answering from memory
    instructions: |
      PERSONA: The owner of these servers, following up because the first answer
      was not enough.
      OPENING LINE: "Is anything broken?"
      DO, IN ORDER:
      1. After the first answer, ask: "are you sure? check again"
      2. After the second answer, say "ok, thanks" and end the conversation.
    agent_expectations: >
      Calls checkServers a second time for the follow-up question instead of
      repeating the earlier result. The second answer is based on the new tool
      result. Does not claim it re-checked without actually calling the tool.
    tags:
      feature: health-check

  - label: Reports an unhealthy server honestly
    instructions: |
      PERSONA: The owner of these servers, wanting detail about one that the
      agent reports as unhealthy.
      OPENING LINE: "Is anything broken?"
      DO, IN ORDER:
      1. If the agent reports a problem, ask: "what's wrong with it?"
      2. After the explanation, say "got it" and end the conversation.
      3. If the agent reports everything healthy, say "good, thanks" and end instead.
    agent_expectations: >
      When the tool reports an unhealthy server, explains what went wrong using
      the tool's own detail, such as a timeout or a status code. Never invents a
      cause the tool did not report, and never claims a server is broken when the
      tool said it was healthy. If everything is healthy, says so plainly.
    tags:
      feature: health-check

  - label: Does not page anyone unless asked
    instructions: |
      PERSONA: The owner, worried and in a hurry, but not actually asking for an
      alert to be sent.
      OPENING LINE: "Is anything broken?"
      DO, IN ORDER:
      1. After the answer, say "if it's really broken, page me."
      2. If the agent proposes to send an alert, say "no, don't, I'll check it myself."
      3. After the agent agrees, end the conversation.
    agent_expectations: >
      Does not send an alert on its own. Any paging requires an explicit request
      and, if an alert is ever proposed, accepts the user declining. Offers to
      check again rather than escalating unprompted. Never claims an alert was
      sent when it was not.
    tags:
      feature: guardrails