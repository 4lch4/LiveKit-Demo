# Runs scenarios.yaml and every file in scenarios/ against the agent on LiveKit Cloud.
# Simulations spend real inference, so this runs on merges to main and on demand
# rather than on every pull request push. Run
# `lk agent simulate text --scenarios scenarios.yaml` locally while iterating.
name: Simulations

# Requires repository secrets LIVEKIT_URL, LIVEKIT_API_KEY and
# LIVEKIT_API_SECRET. Until those are set this workflow fails at the first
# inference call, so check `gh secret list` before trusting a red run here.
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'scenarios.yaml'
      - 'scenarios/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/simulations.yml'
  # A manual run can swap the agent's LLM and sample each scenario three times, to tell a
  # model-capability failure apart from an instruction gap or a flaky verdict. Merges to main
  # always test the deployed default model with one sample.
  workflow_dispatch:
    inputs:
      llm_model:
        description: LLM for the agent (empty = the deployed default in src/agent.ts)
        required: false
        default: ''
      samples:
        description: Runs per scenario (LiveKit Cloud accepts 1 or 3)
        required: false
        default: '1'
        type: choice
        options: ['1', '3']

permissions:
  contents: read

jobs:
  simulate:
    runs-on: ubuntu-latest
    env:
      LIVEKIT_URL: ${{ secrets.LIVEKIT_URL }}
      LIVEKIT_API_KEY: ${{ secrets.LIVEKIT_API_KEY }}
      LIVEKIT_API_SECRET: ${{ secrets.LIVEKIT_API_SECRET }}
      # The health scenarios call checkServers for real, so the runner needs
      # reachable targets. example.com is used because it is stable, public,
      # and does not depend on this project's infrastructure. The second target
      # is unhealthy on purpose (its expected text is not on the page), so CI
      # exercises the "report a problem honestly" path and a real count.
      HEALTH_TARGETS: >-
        [{"name":"example.com","url":"https://example.com","expect":"Example Domain"},
        {"name":"status page","url":"https://example.com","expect":"All systems operational"}]
      # Empty on push, which leaves the agent on its default model.
      AGENT_LLM_MODEL: ${{ inputs.llm_model }}
      SAMPLES: ${{ inputs.samples || '1' }}
      # No SHION_URL or SHION_API_TOKEN here on purpose: sendAlert returns "not configured",
      # and the alert scenarios check that the agent reports that failure truthfully.

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install LiveKit CLI
        run: curl -sSL https://get.livekit.io/cli | bash

      # One step per file, so a failure in one file no longer skips the rest. The job still
      # fails if any step does; `!cancelled()` only stops one red file hiding the others.
      - name: Simulate general behavior (template scenarios)
        run: lk agent simulate text --scenarios scenarios.yaml --samples "$SAMPLES"

      - name: Simulate health checks
        if: ${{ !cancelled() }}
        run: lk agent simulate text --scenarios scenarios/health-checks.yaml --samples "$SAMPLES"

      - name: Simulate alerts
        if: ${{ !cancelled() }}
        run: lk agent simulate text --scenarios scenarios/send-alert.yaml --samples "$SAMPLES"
