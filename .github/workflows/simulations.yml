# Runs the scenarios in scenarios.yaml against your agent on LiveKit Cloud.
# Simulations spend real inference, so this runs on merges to main and on demand
# rather than on every pull request push. Run
# `lk agent simulate text --scenarios scenarios.yaml` locally while iterating.
name: Simulations

# Requires repository secrets LIVEKIT_URL, LIVEKIT_API_KEY and
# LIVEKIT_API_SECRET. Until those are set this workflow fails at the first
# inference call, so check `gh secret list` before trusting a red run here.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  simulate:
    runs-on: ubuntu-latest
    env:
      LIVEKIT_URL: ${{ secrets.LIVEKIT_URL }}
      LIVEKIT_API_KEY: ${{ secrets.LIVEKIT_API_KEY }}
      LIVEKIT_API_SECRET: ${{ secrets.LIVEKIT_API_SECRET }}
      # The health scenarios call checkServers for real, so the runner needs
      # reachable targets. example.com is used because it is stable, public,
      # and does not depend on this project's infrastructure. Replace with the
      # real HEALTH_TARGETS from a secret once the server list is settled.
      HEALTH_TARGETS: >-
        [{"name":"example.com","url":"https://example.com","expect":"Example Domain"}]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install LiveKit CLI
        run: curl -sSL https://get.livekit.io/cli | bash

      - name: Run simulations
        # scenarios.yaml holds the template's generic assistant cases;
        # scenarios/ holds ours. Both are run.
        run: |
          lk agent simulate text --scenarios scenarios.yaml
          lk agent simulate text --scenarios scenarios/health-checks.yaml
